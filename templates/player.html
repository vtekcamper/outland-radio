<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Outland Radio</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="player-body">

<div class="player-wrap">

  <!-- Branding (populated dynamically) -->
  <div class="player-brand">
    {% if branding.has_logo %}
    <img src="/api/logo" id="brandLogo" class="logo-img" alt="{{ branding.store_name }}">
    <div class="logo-mark" id="brandMark" style="display:none">OR</div>
    {% else %}
    <img src="" id="brandLogo" class="logo-img" style="display:none" alt="">
    <div class="logo-mark" id="brandMark">OR</div>
    {% endif %}
    <div class="player-brand-text">
      <span class="brand-name" id="brandName">{{ branding.store_name }}</span>
      <span class="brand-sub"  id="brandSub">{{ branding.store_subtitle }}</span>
    </div>
  </div>

  <!-- Album art -->
  <div class="album-art-wrap">
    <img id="albumImage" src="" alt="" style="display:none">
    <div class="album-placeholder" id="albumPlaceholder">&#9835;</div>
  </div>

  <!-- Waveform -->
  <div class="waveform" id="waveform">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
  </div>

  <!-- Now playing -->
  <div class="now-playing">
    <div class="now-playing-label">IN ONDA ORA</div>
    <div class="track-title" id="trackTitle">Connessione in corso&hellip;</div>
    <div class="track-artist" id="trackArtist"></div>
  </div>

  <!-- Progress -->
  <div class="progress-wrap">
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-times">
      <span id="progressTime">0:00</span>
      <span id="durationTime">0:00</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn-ctrl" id="btnPrev" title="Precedente">&#9664;&#9664;</button>
    <button class="btn-play" id="playBtn" onclick="togglePlay()">
      <span id="playIcon">&#9654;</span>
    </button>
    <button class="btn-ctrl" id="btnNext" title="Successivo">&#9654;&#9654;</button>
  </div>

  <!-- Volume -->
  <div class="volume-wrap">
    <span class="vol-icon">&#128264;</span>
    <input type="range" id="volumeSlider" min="0" max="100" value="80"
           oninput="setVolume(this.value)" class="volume-slider">
    <span class="vol-icon">&#128266;</span>
  </div>

  <!-- Admin link -->
  <a href="/admin" class="admin-link">Admin</a>

</div>

<!-- Spotify Web Playback SDK -->
<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script>
let player     = null;
let deviceId   = null;
let isPlaying  = false;
let progressMs = 0;
let durationMs = 0;
let progressInterval = null;
let lastTrackId = null;

window.onSpotifyWebPlaybackSDKReady = () => {
  fetch('/api/token')
    .then(r => r.json())
    .then(data => {
      if (data.error) { window.location.href = '/auth'; return; }
      initPlayer(data.access_token);
    })
    .catch(() => { window.location.href = '/auth'; });
};

function initPlayer(token) {
  player = new Spotify.Player({
    name: 'Outland Radio — Negozio',
    getOAuthToken: cb => {
      fetch('/api/token')
        .then(r => r.json())
        .then(d => cb(d.access_token));
    },
    volume: 0.8,
  });

  player.addListener('ready', ({ device_id }) => {
    deviceId = device_id;
    // Registra il device sul server così l'admin sa dove suonare
    fetch('/api/register-device', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ device_id }),
    });
    document.getElementById('trackTitle').textContent  = 'Pronto';
    document.getElementById('trackArtist').textContent = 'Seleziona una playlist dal pannello admin';
    pollNowPlaying();
  });

  player.addListener('player_state_changed', state => {
    if (!state) return;
    isPlaying  = !state.paused;
    progressMs = state.position;
    durationMs = state.duration;
    updatePlayUI(isPlaying);

    const track = state.track_window?.current_track;
    if (track) {
      // Detect track change to trigger jingle
      if (track.id && track.id !== lastTrackId) {
        if (lastTrackId !== null) onTrackChange();
        lastTrackId = track.id;
      }

      if (!jinglePlaying) {
        document.getElementById('trackTitle').textContent  = track.name;
        document.getElementById('trackArtist').textContent =
          track.artists.map(a => a.name).join(', ');
      }

      const imgUrl = track.album.images?.[0]?.url;
      if (imgUrl) showAlbumArt(imgUrl);

      updateProgress(state.position, state.duration);
    }

    // Smooth progress ticker
    clearInterval(progressInterval);
    if (isPlaying) {
      progressInterval = setInterval(() => {
        progressMs = Math.min(progressMs + 1000, durationMs);
        updateProgress(progressMs, durationMs);
      }, 1000);
    }
  });

  player.addListener('initialization_error', ({ message }) => {
    setError('Errore di inizializzazione: ' + message);
  });

  player.addListener('authentication_error', () => {
    window.location.href = '/auth';
  });

  player.addListener('account_error', () => {
    setError('Account Spotify Premium richiesto per il Web Playback SDK.');
  });

  // Wire prev/next buttons
  document.getElementById('btnPrev').addEventListener('click', () => player.previousTrack());
  document.getElementById('btnNext').addEventListener('click', () => player.nextTrack());

  player.connect();
}

function togglePlay() {
  if (player) player.togglePlay();
}

function setVolume(v) {
  if (player) player.setVolume(v / 100);
}

function updatePlayUI(playing) {
  document.getElementById('playIcon').innerHTML = playing ? '&#9646;&#9646;' : '&#9654;';
  document.getElementById('waveform').classList.toggle('active', playing);
}

function showAlbumArt(url) {
  const img = document.getElementById('albumImage');
  const ph  = document.getElementById('albumPlaceholder');
  img.src             = url;
  img.style.display   = 'block';
  ph.style.display    = 'none';
}

function updateProgress(pos, dur) {
  const pct = dur > 0 ? (pos / dur) * 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressTime').textContent  = msToTime(pos);
  document.getElementById('durationTime').textContent  = msToTime(dur);
}

function msToTime(ms) {
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

function setError(msg) {
  document.getElementById('trackTitle').textContent  = msg;
  document.getElementById('trackArtist').textContent = '';
}

// Fallback poll — keeps UI in sync if state change event is missed
async function pollNowPlaying() {
  try {
    const r = await fetch('/api/now-playing');
    const d = await r.json();
    if (d.playing && d.title) {
      document.getElementById('trackTitle').textContent  = d.title;
      document.getElementById('trackArtist').textContent = d.artist;
      if (d.image) showAlbumArt(d.image);
    }
  } catch(e) {}
}
setInterval(pollNowPlaying, 15000);

// ── Jingle engine ──────────────────────────────────────────────────────

let jingleCfg     = { enabled: true, every_n_songs: 3, every_n_minutes: 0,
                      rotation_mode: 'no_repeat', crossfade_ms: 1500 };
let songCount     = 0;
let jinglePlaying = false;
let minuteTimer   = null;

async function loadJingleCfg() {
  try {
    const r  = await fetch('/api/jingles/settings');
    jingleCfg = await r.json();
    startMinuteTimer();
  } catch(e) {}
}

function startMinuteTimer() {
  clearInterval(minuteTimer);
  if (jingleCfg.enabled && jingleCfg.every_n_minutes > 0)
    minuteTimer = setInterval(triggerJingle, jingleCfg.every_n_minutes * 60 * 1000);
}

function onTrackChange() {
  songCount++;
  if (jingleCfg.enabled && jingleCfg.every_n_songs > 0 &&
      songCount >= jingleCfg.every_n_songs) {
    songCount = 0;
    setTimeout(triggerJingle, 1500);
  }
}

async function triggerJingle() {
  if (jinglePlaying || !jingleCfg.enabled) return;
  try {
    const r = await fetch('/api/jingles/random');
    const d = await r.json();
    if (!d.url) return;
    playJingle(d.url, d.name);
  } catch(e) {}
}

// ── Crossfade engine ────────────────────────────────────────────────────

// Smooth volume animation: ease-in-out curve, uses requestAnimationFrame
function animateVol(getV, setV, target, ms) {
  return new Promise(resolve => {
    if (ms <= 0) { setV(target); return resolve(); }
    const start = getV();
    const t0    = performance.now();
    const ease  = t => t < .5 ? 2*t*t : -1+(4-2*t)*t;
    const tick  = () => {
      const p = Math.min((performance.now()-t0) / ms, 1);
      setV(Math.max(0, Math.min(1, start + (target-start) * ease(p))));
      p < 1 ? requestAnimationFrame(tick) : resolve();
    };
    requestAnimationFrame(tick);
  });
}

async function playJingle(url, name) {
  if (jinglePlaying) return;
  jinglePlaying = true;

  const fade      = jingleCfg.crossfade_ms ?? 1500;
  const targetVol = document.getElementById('volumeSlider').value / 100;
  const prevTitle  = document.getElementById('trackTitle').textContent;
  const prevArtist = document.getElementById('trackArtist').textContent;

  const audio = new Audio(url);

  // ── Phase 1: fade out Spotify, fade in jingle simultaneously ──────────
  if (fade > 0 && player) {
    audio.volume = 0;
    let sdkVol   = targetVol;

    const started = await audio.play().then(() => true).catch(() => false);
    if (!started) { jinglePlaying = false; return; }

    await Promise.all([
      // Spotify fades to 0
      animateVol(() => sdkVol,        v => { sdkVol = v;        player.setVolume(v); }, 0,         fade),
      // Jingle fades in to target
      animateVol(() => audio.volume,  v => { audio.volume = v;  },                      targetVol, fade),
    ]);
    player.pause();                    // already at vol 0 — inaudible
    player.setVolume(targetVol);       // restore SDK vol for when it resumes

  } else {
    // No crossfade — hard cut
    audio.volume = targetVol;
    if (player) player.pause();
    const started = await audio.play().then(() => true).catch(() => false);
    if (!started) { jinglePlaying = false; if (player) player.resume(); return; }
  }

  document.getElementById('trackTitle').textContent  = name || 'Outland Radio';
  document.getElementById('trackArtist').textContent  = '— Jingle —';

  // ── Phase 2: near end of jingle, crossfade back to Spotify ────────────
  let handledEnd = false;
  const restoreSpotify = async (force = false) => {
    if (handledEnd) return;
    handledEnd = true;

    if (fade > 0 && player) {
      let sdkVol2 = 0;
      player.setVolume(0);
      await player.resume();
      await Promise.all([
        // Jingle fades out
        animateVol(() => audio.volume, v => { audio.volume = v; }, 0,         fade * 0.9),
        // Spotify fades in (slight delay for natural feel)
        (async () => {
          await new Promise(r => setTimeout(r, fade * 0.15));
          await animateVol(() => sdkVol2, v => { sdkVol2 = v; player.setVolume(v); }, targetVol, fade * 0.85);
        })(),
      ]);
    } else {
      if (player) { await player.resume(); player.setVolume(targetVol); }
    }

    document.getElementById('trackTitle').textContent  = prevTitle;
    document.getElementById('trackArtist').textContent  = prevArtist;
    jinglePlaying = false;
  };

  // Start fade-out when remaining time ≤ fade duration
  audio.addEventListener('timeupdate', () => {
    if (!handledEnd && isFinite(audio.duration) && audio.duration > 0) {
      const remaining = (audio.duration - audio.currentTime) * 1000;
      if (remaining <= fade + 80) restoreSpotify();
    }
  });
  audio.addEventListener('ended', () => restoreSpotify());
  audio.addEventListener('error', () => {
    handledEnd = true;
    jinglePlaying = false;
    if (player) { player.resume(); player.setVolume(targetVol); }
    document.getElementById('trackTitle').textContent  = prevTitle;
    document.getElementById('trackArtist').textContent  = prevArtist;
  });
}

loadJingleCfg();

// ── Branding ───────────────────────────────────────────────────────────

async function applyBranding() {
  try {
    const r = await fetch('/api/branding');
    const b = await r.json();
    document.getElementById('brandName').textContent = b.store_name     || 'OUTLAND RADIO';
    document.getElementById('brandSub').textContent  = b.store_subtitle || '';

    const mark = document.getElementById('brandMark');
    const logo = document.getElementById('brandLogo');
    if (b.has_logo) {
      logo.src = '/api/logo?v=' + Date.now();
      logo.style.display = 'block';
      mark.style.display = 'none';
    } else {
      const initials = (b.store_name || 'OR').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
      mark.textContent = initials;
      mark.style.display = 'flex';
      logo.style.display = 'none';
    }

    const root = document.documentElement;
    root.style.setProperty('--color-primary', b.primary_color || '#d97706');
    root.style.setProperty('--color-text',    b.text_color    || '#f0f4f5');
    const bg = b.bg_color || '#1c2b33';
    root.style.setProperty('--color-bg', bg);
    const h = bg.replace('#','');
    const dark = `rgb(${Math.floor(parseInt(h.slice(0,2),16)*.6)},${Math.floor(parseInt(h.slice(2,4),16)*.6)},${Math.floor(parseInt(h.slice(4,6),16)*.6)})`;
    root.style.setProperty('--color-bg-dark', dark);
  } catch(e) {}
}

applyBranding();
</script>
</body>
</html>
