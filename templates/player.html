<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Outland Radio</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="player-body">

<div class="player-wrap">

  <!-- Branding -->
  <div class="player-brand">
    {% if branding.has_logo %}
    <img src="/api/logo" id="brandLogo" class="logo-img" alt="{{ branding.store_name }}">
    <div class="logo-mark" id="brandMark" style="display:none">OR</div>
    {% else %}
    <img src="" id="brandLogo" class="logo-img" style="display:none" alt="">
    <div class="logo-mark" id="brandMark">OR</div>
    {% endif %}
    <div class="player-brand-text">
      <span class="brand-name" id="brandName">{{ branding.store_name }}</span>
      <span class="brand-sub"  id="brandSub">{{ branding.store_subtitle }}</span>
    </div>
  </div>

  <!-- Album art -->
  <div class="album-art-wrap">
    <img id="albumImage" src="" alt="" style="display:none">
    <div class="album-placeholder" id="albumPlaceholder">&#9835;</div>
  </div>

  <!-- Waveform -->
  <div class="waveform" id="waveform">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
  </div>

  <!-- Now playing -->
  <div class="now-playing">
    <div class="now-playing-label">IN ONDA ORA</div>
    <div class="track-title" id="trackTitle">Connessione in corso&hellip;</div>
    <div class="track-artist" id="trackArtist"></div>
  </div>

  <!-- Progress -->
  <div class="progress-wrap">
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-times">
      <span id="progressTime">0:00</span>
      <span id="durationTime">0:00</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn-ctrl" id="btnPrev" title="Precedente">&#9664;&#9664;</button>
    <button class="btn-play" id="playBtn" onclick="togglePlay()">
      <span id="playIcon">&#9654;</span>
    </button>
    <button class="btn-ctrl" id="btnNext" title="Successivo">&#9654;&#9654;</button>
  </div>

  <!-- Volume -->
  <div class="volume-wrap">
    <span class="vol-icon">&#128264;</span>
    <input type="range" id="volumeSlider" min="0" max="100" value="80"
           oninput="onSliderChange(this.value)" class="volume-slider">
    <span class="vol-icon">&#128266;</span>
  </div>

  <!-- Admin link -->
  <a href="/admin" class="admin-link">Admin</a>

</div><!-- /player-wrap -->

<!-- Spotify Web Playback SDK -->
<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════
let player           = null;
let deviceId         = null;
let isPlaying        = false;
let progressMs       = 0;
let durationMs       = 0;
let progressInterval = null;
let lastTrackId      = null;

let jinglePlaying    = false;
let announcePlaying  = false;

let jingleCfg = { enabled: true, every_n_songs: 3, every_n_minutes: 0,
                  rotation_mode: 'no_repeat', crossfade_ms: 1500 };

// Spotify slider volume (0–1) — kept in sync with the slider
let sliderVol = 0.8;

// ═══════════════════════════════════════════════════════════════════════════
// WEB AUDIO API  (for jingle / announce mixing — NOT Spotify itself)
// ═══════════════════════════════════════════════════════════════════════════
let audioCtx = null;
let sfxGain  = null;   // GainNode for jingle/announce audio

function ensureAudioCtx() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  sfxGain  = audioCtx.createGain();
  sfxGain.gain.value = 0;
  sfxGain.connect(audioCtx.destination);
  // Resume context after user gesture (browser autoplay policy)
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

// Schedule a Spotify SDK volume ramp using precise Web Audio clock timing.
// Since Spotify SDK doesn't expose an AudioNode, we use a stepped setTimeout
// approach referenced to audioCtx.currentTime so it stays in sync.
function scheduleSpotifyRamp(fromVol, toVol, atAudioTime, fadeSec) {
  if (!audioCtx) return;
  const startDelay = Math.max(0, (atAudioTime - audioCtx.currentTime) * 1000);
  const STEPS      = 24;
  const stepMs     = (fadeSec * 1000) / STEPS;
  setTimeout(() => {
    for (let i = 0; i <= STEPS; i++) {
      setTimeout(() => {
        const t   = i / STEPS;
        const ease = t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t;   // ease-in-out
        const vol  = fromVol + (toVol - fromVol) * ease;
        if (player) player.setVolume(Math.max(0, Math.min(1, vol)));
      }, i * stepMs);
    }
  }, startDelay);
}

// ═══════════════════════════════════════════════════════════════════════════
// SPOTIFY WEB PLAYBACK SDK
// ═══════════════════════════════════════════════════════════════════════════
window.onSpotifyWebPlaybackSDKReady = () => {
  fetch('/api/token')
    .then(r => r.json())
    .then(d => { if (d.error) { window.location.href = '/auth'; return; } initPlayer(d.access_token); })
    .catch(() => { window.location.href = '/auth'; });
};

function initPlayer(token) {
  player = new Spotify.Player({
    name: 'Outland Radio — Negozio',
    getOAuthToken: cb => fetch('/api/token').then(r => r.json()).then(d => cb(d.access_token)),
    volume: sliderVol,
  });

  player.addListener('ready', ({ device_id }) => {
    deviceId = device_id;
    ensureAudioCtx();
    fetch('/api/register-device', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ device_id }),
    });
    document.getElementById('trackTitle').textContent  = 'Pronto';
    document.getElementById('trackArtist').textContent = 'Seleziona una playlist dal pannello admin';
    pollNowPlaying();
  });

  player.addListener('player_state_changed', state => {
    if (!state) return;
    isPlaying  = !state.paused;
    progressMs = state.position;
    durationMs = state.duration;
    updatePlayUI(isPlaying);

    const track = state.track_window?.current_track;
    if (track) {
      if (track.id && track.id !== lastTrackId) {
        if (lastTrackId !== null) {
          // Notify server about track change (server handles jingle trigger logic)
          fetch('/api/track-changed', { method: 'POST' }).catch(() => {});
        }
        lastTrackId = track.id;
      }

      if (!jinglePlaying && !announcePlaying) {
        document.getElementById('trackTitle').textContent  = track.name;
        document.getElementById('trackArtist').textContent = track.artists.map(a => a.name).join(', ');
      }

      const imgUrl = track.album.images?.[0]?.url;
      if (imgUrl) showAlbumArt(imgUrl);
      updateProgress(state.position, state.duration);
    }

    clearInterval(progressInterval);
    if (isPlaying) {
      progressInterval = setInterval(() => {
        progressMs = Math.min(progressMs + 1000, durationMs);
        updateProgress(progressMs, durationMs);
      }, 1000);
    }
  });

  player.addListener('initialization_error', ({ message }) => setError('Errore di inizializzazione: ' + message));
  player.addListener('authentication_error',  ()           => { window.location.href = '/auth'; });
  player.addListener('account_error',         ()           => setError('Account Spotify Premium richiesto.'));

  document.getElementById('btnPrev').addEventListener('click', () => player.previousTrack());
  document.getElementById('btnNext').addEventListener('click', () => player.nextTrack());

  player.connect();
}

function togglePlay() {
  ensureAudioCtx();
  if (player) player.togglePlay();
}

function onSliderChange(v) {
  sliderVol = v / 100;
  if (player && !jinglePlaying && !announcePlaying) player.setVolume(sliderVol);
}

function updatePlayUI(playing) {
  document.getElementById('playIcon').innerHTML = playing ? '&#9646;&#9646;' : '&#9654;';
  document.getElementById('waveform').classList.toggle('active', playing);
}

function showAlbumArt(url) {
  const img = document.getElementById('albumImage');
  const ph  = document.getElementById('albumPlaceholder');
  img.src           = url;
  img.style.display = 'block';
  ph.style.display  = 'none';
}

function updateProgress(pos, dur) {
  const pct = dur > 0 ? (pos / dur) * 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressTime').textContent = msToTime(pos);
  document.getElementById('durationTime').textContent = msToTime(dur);
}

function msToTime(ms) {
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

function setError(msg) {
  document.getElementById('trackTitle').textContent  = msg;
  document.getElementById('trackArtist').textContent = '';
}

// Fallback poll to keep UI in sync (low frequency — SSE handles real-time)
async function pollNowPlaying() {
  try {
    const d = await fetch('/api/now-playing').then(r => r.json());
    if (d.playing && d.title && !jinglePlaying && !announcePlaying) {
      document.getElementById('trackTitle').textContent  = d.title;
      document.getElementById('trackArtist').textContent = d.artist;
      if (d.image) showAlbumArt(d.image);
    }
  } catch {}
}
setInterval(pollNowPlaying, 20_000);

// ═══════════════════════════════════════════════════════════════════════════
// AUDIO OVERLAY ENGINE  (jingle + announce — shared logic)
// ═══════════════════════════════════════════════════════════════════════════

/**
 * playOverlay: plays audio from `src` over Spotify.
 *
 * For JINGLES: pauses Spotify, plays jingle at full volume, resumes.
 * For ANNOUNCES: ducks Spotify to duckTarget, plays announce on top, restores.
 *
 * All Spotify volume transitions use scheduleSpotifyRamp() which references
 * audioCtx.currentTime, so they run even when this tab is in the background.
 * The sfxGain AudioParam uses linearRampToValueAtTime for hardware-precise fading.
 */
async function playOverlay({ src, name, crossfade_ms = 1500, duckTarget = null }) {
  // duckTarget === null  → jingle mode (pause Spotify)
  // duckTarget === 0..1  → announce mode (duck Spotify to fraction of slider)
  if (jinglePlaying || announcePlaying) return;

  const isJingle = duckTarget === null;
  if (isJingle) jinglePlaying = true; else announcePlaying = true;

  ensureAudioCtx();

  // Ensure AudioContext is running (it may be suspended on some browsers)
  if (audioCtx.state !== 'running') {
    try { await audioCtx.resume(); } catch {}
  }

  // ── Pre-fetch and decode BEFORE touching Spotify volume ──────────────
  // Using AudioBufferSourceNode instead of HTMLAudioElement.play():
  //  • AudioBufferSourceNode.start() has NO autoplay restrictions
  //  • HTMLAudioElement.play() from an SSE handler (no user gesture) gets
  //    blocked by browsers, leaving Spotify silenced with no audio at all
  let audioBuffer;
  try {
    const resp = await fetch(src);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const arrayBuf = await resp.arrayBuffer();
    audioBuffer = await audioCtx.decodeAudioData(arrayBuf);
  } catch (err) {
    console.warn('[overlay] Audio load failed, aborting:', err);
    if (isJingle) jinglePlaying = false; else announcePlaying = false;
    return;  // bail out — Spotify was never touched
  }

  // ── Phase 1: audio ready → duck/pause Spotify, then start SFX ────────
  const fadeS   = Math.max(0, crossfade_ms) / 1000;
  const duckVol = isJingle ? 0 : sliderVol * Math.max(0, Math.min(1, duckTarget));
  const now     = audioCtx.currentTime;

  sfxGain.gain.cancelScheduledValues(now);
  sfxGain.gain.setValueAtTime(0, now);
  if (fadeS > 0) {
    sfxGain.gain.linearRampToValueAtTime(1.0, now + fadeS);
    scheduleSpotifyRamp(sliderVol, duckVol, now, fadeS);
  } else {
    sfxGain.gain.setValueAtTime(1.0, now);
  }

  // Start playback via AudioBufferSourceNode (works in any running AudioContext)
  const bufSrc = audioCtx.createBufferSource();
  bufSrc.buffer = audioBuffer;
  bufSrc.connect(sfxGain);
  bufSrc.start(now);

  // For jingles: pause Spotify after the fade-in completes
  if (isJingle) {
    setTimeout(() => {
      if (player) { player.setVolume(0); player.pause(); }
    }, fadeS * 1000);
  }

  // ── Phase 2: restore ──────────────────────────────────────────────────
  let restored = false;

  async function restore() {
    if (restored) return;
    restored = true;

    const endNow   = audioCtx.currentTime;
    const restoreS = fadeS > 0 ? fadeS : 0.05;

    sfxGain.gain.cancelScheduledValues(endNow);
    sfxGain.gain.setValueAtTime(sfxGain.gain.value, endNow);
    sfxGain.gain.linearRampToValueAtTime(0, endNow + restoreS);

    if (isJingle && player) {
      player.setVolume(0);
      await player.resume();
      scheduleSpotifyRamp(0, sliderVol, endNow, restoreS);
    } else if (!isJingle) {
      scheduleSpotifyRamp(duckVol, sliderVol, endNow, restoreS);
    }

    setTimeout(() => {
      sfxGain.gain.setValueAtTime(0, audioCtx.currentTime);
      if (player) player.setVolume(sliderVol);
      if (isJingle) jinglePlaying = false; else announcePlaying = false;
    }, (restoreS + 0.1) * 1000);
  }

  // Early restore when approaching end (only for files longer than 2×fade + 0.5s)
  const earlyFadeThresholdSec = fadeS * 2 + 0.5;
  if (audioBuffer.duration > earlyFadeThresholdSec) {
    setTimeout(restore, (audioBuffer.duration - fadeS) * 1000);
  }
  bufSrc.onended = () => restore();
}

// ═══════════════════════════════════════════════════════════════════════════
// SSE  — receive events from server
// ═══════════════════════════════════════════════════════════════════════════
function connectSSE() {
  const es = new EventSource('/api/stream');

  es.onmessage = (e) => {
    let event;
    try { event = JSON.parse(e.data); } catch { return; }

    switch (event.type) {
      case 'JINGLE':
        if (jinglePlaying || announcePlaying) return;
        playOverlay({
          src:          event.src,
          name:         event.name,
          crossfade_ms: event.crossfade_ms ?? 1500,
          duckTarget:   null,   // jingle mode
        });
        break;

      case 'ANNOUNCE':
        if (announcePlaying || jinglePlaying) return;
        playOverlay({
          src:          event.src,
          name:         event.name,
          crossfade_ms: event.crossfade_ms ?? 1000,
          duckTarget:   event.duck_volume  ?? 0.3,
        });
        break;
    }
  };

  es.onerror = () => {
    // Browser auto-reconnects EventSource after error, but add a small delay
    es.close();
    setTimeout(connectSSE, 5_000);
  };
}

connectSSE();

// ═══════════════════════════════════════════════════════════════════════════
// BRANDING  — apply CSS custom properties from server
// ═══════════════════════════════════════════════════════════════════════════
async function applyBranding() {
  try {
    const b    = await fetch('/api/branding').then(r => r.json());
    const root = document.documentElement;

    document.getElementById('brandName').textContent = b.store_name     || 'OUTLAND RADIO';
    document.getElementById('brandSub').textContent  = b.store_subtitle || '';

    const mark = document.getElementById('brandMark');
    const logo = document.getElementById('brandLogo');
    if (b.has_logo) {
      logo.src = '/api/logo?v=' + Date.now();
      logo.style.display = 'block';
      mark.style.display = 'none';
    } else {
      const initials = (b.store_name || 'OR').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
      mark.textContent = initials;
      mark.style.display = 'flex';
      logo.style.display = 'none';
    }

    root.style.setProperty('--color-primary', b.primary_color || '#d97706');
    root.style.setProperty('--color-text',    b.text_color    || '#f0f4f5');
    const bg = b.bg_color || '#1c2b33';
    root.style.setProperty('--color-bg', bg);
    const h    = bg.replace('#', '');
    const dark = `rgb(${Math.floor(parseInt(h.slice(0,2),16)*.6)},${Math.floor(parseInt(h.slice(2,4),16)*.6)},${Math.floor(parseInt(h.slice(4,6),16)*.6)})`;
    root.style.setProperty('--color-bg-dark', dark);
  } catch {}
}

applyBranding();
</script>
</body>
</html>
